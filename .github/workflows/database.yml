name: Database CI

on:
  pull_request:
  push:
    branches: [main, redesign]

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start disposable local Supabase
        run: npm run db:start
      - name: Rebuild database from migrations
        run: npm run db:reset
      - name: CRUD, constraints, RLS and repeatability
        run: npm run db:test
      - name: Upgrade previous-schema fixture
        run: npm run db:upgrade
      - name: Verify generated types
        run: npm run db:types:check
      - name: Stop disposable stack
        if: always()
        run: npm run db:stop
