name: Deploy database migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'scripts/db/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-database.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Database to migrate (staging may run from any branch; production only from main)
        type: choice
        options: [staging, production]
        default: staging
        required: true
      mode:
        description: Preview pending migrations or apply them
        type: choice
        options: [preview, deploy]
        default: preview
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.target || 'production' }}-database
  cancel-in-progress: false

jobs:
  core:
    uses: ./.github/workflows/ci.yml
  database:
    uses: ./.github/workflows/database.yml
  release:
    needs: [core, database]
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DATABASE_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Each GitHub environment holds its own SUPABASE_* secrets under the same names.
    environment: ${{ inputs.target == 'staging' && 'Staging' || 'Production' }}
    env:
      TARGET: ${{ inputs.target || 'production' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN secret'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD secret'; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo 'Missing SUPABASE_PROJECT_ID secret'; exit 1; }
      - name: Check target project
        shell: bash
        run: |
          if [ "$TARGET" = staging ]; then
            test -n "$PRODUCTION_SUPABASE_PROJECT_REF" || { echo 'Set the PRODUCTION_SUPABASE_PROJECT_REF repository variable before migrating staging'; exit 1; }
            test "$SUPABASE_PROJECT_ID" != "$PRODUCTION_SUPABASE_PROJECT_REF" || { echo 'The Staging environment points at the production project'; exit 1; }
          elif [ -n "$PRODUCTION_SUPABASE_PROJECT_REF" ]; then
            test "$SUPABASE_PROJECT_ID" = "$PRODUCTION_SUPABASE_PROJECT_REF" || { echo 'The Production environment does not match PRODUCTION_SUPABASE_PROJECT_REF'; exit 1; }
          fi
      - name: Link ${{ inputs.target || 'production' }} project
        run: npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Compare migration history
        run: npx --no-install supabase migration list --linked
      - name: Preview pending migrations
        run: npx --no-install supabase db push --linked --dry-run
      - name: Apply pending migrations
        if: github.event_name == 'push' || inputs.mode == 'deploy'
        run: npx --no-install supabase db push --linked --yes
      - name: Verify migration history
        if: github.event_name == 'push' || inputs.mode == 'deploy'
        run: npx --no-install supabase migration list --linked
