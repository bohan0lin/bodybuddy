name: Deploy database migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'scripts/db/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-database.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview pending migrations or apply them
        type: choice
        options: [preview, deploy]
        default: preview
        required: true

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  core:
    uses: ./.github/workflows/ci.yml
  database:
    uses: ./.github/workflows/database.yml
  release:
    needs: [core, database]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.DATABASE_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN secret'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD secret'; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo 'Missing SUPABASE_PROJECT_ID secret'; exit 1; }
      - name: Link production project
        run: npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Compare migration history
        run: npx --no-install supabase migration list --linked
      - name: Preview pending migrations
        run: npx --no-install supabase db push --linked --dry-run
      - name: Apply pending migrations
        if: github.event_name == 'push' || inputs.mode == 'deploy'
        run: npx --no-install supabase db push --linked --yes
      - name: Verify migration history
        if: github.event_name == 'push' || inputs.mode == 'deploy'
        run: npx --no-install supabase migration list --linked
