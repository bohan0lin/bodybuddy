name: AI evals

# Live model calls require an explicit dispatch and configured evaluation credentials.
on:
  workflow_dispatch:
    inputs:
      live:
        type: boolean
        default: false
      suite:
        type: choice
        options: [all, tools, retrieval]
        default: all
      max_cases:
        type: number
        default: 12
      max_usd:
        type: number
        default: 0.5

permissions:
  contents: read
concurrency:
  group: model-evaluation
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run versioned evaluation
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_SUPABASE_URL: ${{ secrets.EVAL_SUPABASE_URL }}
          EVAL_SUPABASE_ANON_KEY: ${{ secrets.EVAL_SUPABASE_ANON_KEY }}
          EVAL_EMBEDDING_MAX_USD_PER_QUERY: ${{ vars.EVAL_EMBEDDING_MAX_USD_PER_QUERY }}
          EVAL_LIVE: ${{ inputs.live }}
          EVAL_SUITE: ${{ inputs.suite }}
          EVAL_MAX_CASES: ${{ inputs.max_cases }}
          EVAL_MAX_USD: ${{ inputs.max_usd }}
        run: |
          mode=--dry-run
          if [ "$EVAL_LIVE" = true ]; then mode=--live; fi
          npm run eval -- "$mode" --suite "$EVAL_SUITE" --max-cases "$EVAL_MAX_CASES" --max-usd "$EVAL_MAX_USD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-reports
          path: evals/results/
          if-no-files-found: warn
